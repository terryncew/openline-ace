name: agent-contract-audit-001

on:
  push:
    paths:
      - "experiments/agent-contract-audit-001/**"
      - ".github/workflows/agent-contract-audit-001.yml"
      - "README.md"
  pull_request:
    paths:
      - "experiments/agent-contract-audit-001/**"
      - ".github/workflows/agent-contract-audit-001.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  contract-microscope-conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: experiments/agent-contract-audit-001
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen evidence
        run: python -m aca001 verify-evidence
      - name: Recompute conformance
        run: python -m aca001 conformance --output "$RUNNER_TEMP/aca001-conformance"
      - name: Randomized hostile probe
        run: python scripts/randomized_hostile_probe.py
      - name: Isolated release check
        run: python scripts/release_check.py
