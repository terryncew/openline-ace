name: ACE Regime Transition Audit 002

on:
  pull_request:
    paths:
      - "experiments/regime-transition-audit-002/**"
      - ".github/workflows/ace-regime-transition-audit-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-rta002:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: experiments/regime-transition-audit-002
        run: python -m unittest discover -s tests -v
      - name: Fetch frozen external review history and run RTA-002
        working-directory: experiments/regime-transition-audit-002
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/run_external.py
      - name: Independent result verification
        working-directory: experiments/regime-transition-audit-002
        run: python scripts/verify_result.py
      - uses: actions/upload-artifact@v6
        with:
          name: rta002-external-evidence
          path: |
            experiments/regime-transition-audit-002/external_raw.json
            experiments/regime-transition-audit-002/external_cases.jsonl
            experiments/regime-transition-audit-002/external_result.json
            experiments/regime-transition-audit-002/source_manifest.json
            experiments/regime-transition-audit-002/preregistration.json
          if-no-files-found: error
