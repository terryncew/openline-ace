name: Frame Ledger 001

on:
  push:
    branches: [main]
    paths:
      - 'experiments/frame-ledger-001-accusation-debt/**'
      - '.github/workflows/frame-ledger-001.yml'
  pull_request:
    paths:
      - 'experiments/frame-ledger-001-accusation-debt/**'
      - '.github/workflows/frame-ledger-001.yml'

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify frozen experiment
        working-directory: experiments/frame-ledger-001-accusation-debt
        run: |
          python -m unittest discover -s tests -v
          python src/render.py --out /tmp/prompts.jsonl
          diff -u data/prompts.jsonl /tmp/prompts.jsonl
          python src/score.py data/example_results.jsonl --out /tmp/example_score.json
          diff -u data/example_score.json /tmp/example_score.json
          sha256sum -c SHA256SUMS
          if find . -type d -name __pycache__ -o -type f -name '*.pyc' | grep -q .; then
            echo 'compiled Python artifacts must not be committed'
            exit 1
          fi
