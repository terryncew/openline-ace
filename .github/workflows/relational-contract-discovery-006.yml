name: relational-contract-discovery-006

on:
  push:
    paths:
      - "experiments/relational-contract-discovery-006/**"
      - ".github/workflows/relational-contract-discovery-006.yml"
      - "README.md"
  pull_request:
    paths:
      - "experiments/relational-contract-discovery-006/**"
      - ".github/workflows/relational-contract-discovery-006.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  envharness-heldout-mechanism-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: experiments/relational-contract-discovery-006
    env:
      PYTHONPATH: ${{ github.workspace }}/_upstream/envharness:.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout pinned EnvHarness source
        uses: actions/checkout@v6
        with:
          repository: google-research/envharness
          ref: fab7d57441f06b75c73a900e04561d4d7600f361
          path: _upstream/envharness
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded core dependencies
        run: python -m pip install "pydantic>=2,<3" "pyyaml>=6,<7"
      - name: Verify upstream, fixtures, and policy boundaries
        run: |
          python -m rcdl006 verify-upstream
          python -m rcdl006 verify-fixtures
          python -m rcdl006 verify-policy-boundary
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Recompute held-out mechanism tournament
        run: python -m rcdl006 run --output "$RUNNER_TEMP/rcdl006-heldout-mechanism"
      - name: Verify recomputed manifest and projection
        run: |
          python -m rcdl006 verify-manifest "$RUNNER_TEMP/rcdl006-heldout-mechanism/heldout-mechanism-manifest.json"
          python -m rcdl006 verify-projection "$RUNNER_TEMP/rcdl006-heldout-mechanism/verified-handoff-projection.json"
      - name: Randomized nuisance and transport probe
        run: python scripts/randomized_probe.py --samples 512
      - name: Full isolated release check
        run: python scripts/release_check.py --samples 384 --output "$RUNNER_TEMP/rcdl006-release-check.json"
      - name: Verify frozen evidence
        run: python -m rcdl006 verify-evidence
