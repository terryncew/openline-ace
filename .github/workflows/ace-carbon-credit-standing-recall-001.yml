name: ACE Carbon Credit Standing Recall 001
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify CCR-001 external-policy replay
        working-directory: experiments/carbon-credit-standing-recall-001
        run: python scripts/release_check.py
