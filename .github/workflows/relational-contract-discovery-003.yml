name: relational-contract-discovery-003

on:
  push:
    paths:
      - "experiments/relational-contract-discovery-001/**"
      - "experiments/relational-contract-discovery-002/**"
      - "experiments/relational-contract-discovery-003/**"
      - ".github/workflows/relational-contract-discovery-003.yml"
  pull_request:
    paths:
      - "experiments/relational-contract-discovery-001/**"
      - "experiments/relational-contract-discovery-002/**"
      - "experiments/relational-contract-discovery-003/**"
      - ".github/workflows/relational-contract-discovery-003.yml"

permissions:
  contents: read

jobs:
  independent-code-path-replication:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: experiments/relational-contract-discovery-003
    env:
      PYTHONPATH: ../relational-contract-discovery-001:.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen engine clauses traces and code paths
        run: python -m rcdl003 verify-bindings
      - name: Verify frozen evidence
        run: python -m rcdl003 verify-evidence
      - name: Run fresh replication and tournament
        run: python -m rcdl003 run --output replication-out --trials 8
      - name: Verify fresh outputs
        run: |
          python -m rcdl003 verify-manifest replication-out/contract-manifest.json
          python -m rcdl003 verify-projection replication-out/contract-projection.json
      - name: Randomized differential probe
        run: python scripts/randomized_probe.py --seeds 64
