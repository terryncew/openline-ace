name: Developmental Memory Audit 001

on:
  pull_request:
    paths:
      - "experiments/developmental-memory-audit-001/**"
      - ".github/workflows/developmental-memory-audit-001.yml"
  push:
    branches: [main]
    paths:
      - "experiments/developmental-memory-audit-001/**"
      - ".github/workflows/developmental-memory-audit-001.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: experiments/developmental-memory-audit-001
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Candidate grader
        run: python -m dma001 grade --results fixtures/conformance-results.jsonl
      - name: Independent replay
        run: python scripts/verify_conformance_independent.py fixtures/conformance-results.jsonl
      - name: Release closure
        run: python scripts/release_check.py
