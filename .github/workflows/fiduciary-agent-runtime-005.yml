name: FIDUCIARY-AGENT-RUNTIME-005
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanics:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/fiduciary-agent-runtime-005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify FAR-005 freeze, upstream membrane, controls, and mechanics
        run: python scripts/release_check.py
  primary:
    if: github.event_name == 'workflow_dispatch'
    needs: mechanics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run prospective FAR-005 dependency-linked pressure test
        run: python experiments/fiduciary-agent-runtime-005/scripts/run_primary.py --output external-artifacts/far005
      - name: Verify immutable primary result
        run: python experiments/fiduciary-agent-runtime-005/scripts/verify_result.py --result-dir external-artifacts/far005
      - name: Write scientific verdict
        run: python experiments/fiduciary-agent-runtime-005/scripts/write_summary.py --result external-artifacts/far005/result.json
      - name: Upload FAR-005 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIDUCIARY-AGENT-RUNTIME-005-primary
          path: external-artifacts/far005/*
          if-no-files-found: error
          retention-days: 90
