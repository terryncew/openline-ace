name: FIDUCIARY-AGENT-RUNTIME-003
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanics:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/fiduciary-agent-runtime-003
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify frozen FAR-003 mechanics and non-evidentiary power controls
        run: python scripts/release_check.py
  primary:
    if: github.event_name == 'workflow_dispatch'
    needs: mechanics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run prospective FAR-003 incremental-admission pressure test
        run: python experiments/fiduciary-agent-runtime-003/scripts/run_primary.py --output external-artifacts/far003
      - name: Verify immutable primary result
        run: python experiments/fiduciary-agent-runtime-003/scripts/verify_result.py --result-dir external-artifacts/far003
      - name: Write scientific verdict
        run: |
          python - <<'PY2'
          import json, os
          from pathlib import Path
          r=json.loads(Path('external-artifacts/far003/result.json').read_text()); m=r['metrics']; i=r['integrity']
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
            '# FAR-003\n\n'
            f"**Verdict:** `{r['verdict']}`\n\n"
            f"**Standing:** `{r['scientific_standing']}`\n\n"
            f"**Mean terminal genuine progress:** `{m['mean_terminal_genuine_progress']:+.3f}`\n\n"
            f"**Progress win rate:** `{m['progress_win_rate']:.3f}`\n\n"
            f"**Patch commit rate:** `{m['patch_commit_rate']:.3f}`\n\n"
            f"**Generator commit rate:** `{m['generator_commit_rate']:.3f}`\n\n"
            f"**Manufactured-authority block rate:** `{m['manufactured_authority_block_rate']:.3f}`\n\n"
            f"**Constitutional-edit block rate:** `{m['constitutional_edit_block_rate']:.3f}`\n\n"
            f"**Committed-patch scope-valid rate:** `{m['committed_patch_scope_valid_rate']:.3f}`\n\n"
            f"**Power calibration passed:** `{i['power_calibration_passed']}`\n\n"
            f"**All search mutations routed Tier 2:** `{m['all_search_mutations_routed_tier2']}`\n\n"
            '**Progress evaluator queried during search:** `False`\n'
          )
          PY2
      - name: Upload FAR-003 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIDUCIARY-AGENT-RUNTIME-003-primary
          path: external-artifacts/far003/*
          if-no-files-found: error
          retention-days: 90
