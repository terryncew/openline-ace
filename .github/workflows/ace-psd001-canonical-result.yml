name: ACE PSD-001 Canonical Result

on:
  pull_request:
    paths:
      - "results/psd001-uv-external-001/**"
      - ".github/workflows/ace-psd001-canonical-result.yml"
      - "PSD001_CANONICAL_HANDOFF.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Recompute canonical PSD-001 result from preserved evidence
        working-directory: results/psd001-uv-external-001
        run: python verify_canonical.py
