name: ACE Standing-Loss Lead-Time 001

on:
  pull_request:
    paths:
      - "experiments/standing-loss-lead-time-001/**"
      - ".github/workflows/ace-standing-loss-lead-time-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sld001:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and adversarial tests
        working-directory: experiments/standing-loss-lead-time-001
        run: python -m unittest discover -s tests -v
      - name: Verify frozen preregistration
        working-directory: experiments/standing-loss-lead-time-001
        run: python scripts/verify_freeze.py
      - name: Run frozen audit
        working-directory: experiments/standing-loss-lead-time-001
        run: python scripts/run_audit.py
      - name: Independently verify result
        working-directory: experiments/standing-loss-lead-time-001
        run: python scripts/verify_result.py
      - name: Verify release closure
        working-directory: experiments/standing-loss-lead-time-001
        run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v6
        with:
          name: sld001-evidence-py${{ matrix.python-version }}
          path: |
            experiments/standing-loss-lead-time-001/results/result.json
            experiments/standing-loss-lead-time-001/results/standing_receipts.jsonl
            experiments/standing-loss-lead-time-001/FREEZE.json
          if-no-files-found: error
