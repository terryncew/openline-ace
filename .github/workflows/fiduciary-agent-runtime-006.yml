name: FIDUCIARY-AGENT-RUNTIME-006
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanics:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/fiduciary-agent-runtime-006
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify FAR-006 freeze, external pins, controls, and mechanics
        run: python scripts/release_check.py
  primary:
    if: github.event_name == 'workflow_dispatch'
    needs: mechanics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run prospective FAR-006 external repository promotion test
        run: python experiments/fiduciary-agent-runtime-006/scripts/run_primary.py --output external-artifacts/far006
      - name: Verify immutable primary result
        run: python experiments/fiduciary-agent-runtime-006/scripts/verify_result.py --result-dir external-artifacts/far006
      - name: Write scientific verdict
        run: python experiments/fiduciary-agent-runtime-006/scripts/write_summary.py --result external-artifacts/far006/result.json
      - name: Upload FAR-006 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FIDUCIARY-AGENT-RUNTIME-006-primary
          path: |
            external-artifacts/far006/*.json
            external-artifacts/far006/*.sha256
          if-no-files-found: error
          retention-days: 90
