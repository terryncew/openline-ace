name: Assurance Runtime Closeout
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify canonical Assurance Runtime archive and FAR freeze
        run: python assurance-runtime/verify_closeout.py
