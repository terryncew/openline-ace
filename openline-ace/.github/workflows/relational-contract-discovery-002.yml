name: relational-contract-discovery-002

on:
  push:
    paths:
      - "experiments/relational-contract-discovery-001/**"
      - "experiments/relational-contract-discovery-002/**"
      - ".github/workflows/relational-contract-discovery-002.yml"
  pull_request:
    paths:
      - "experiments/relational-contract-discovery-001/**"
      - "experiments/relational-contract-discovery-002/**"
      - ".github/workflows/relational-contract-discovery-002.yml"

permissions:
  contents: read

jobs:
  deterministic-workflow-transport:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: experiments/relational-contract-discovery-002
    env:
      PYTHONPATH: ../relational-contract-discovery-001:.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Verify frozen RCDL 0.1 engine
        run: python -m rcdl002 verify-engine
      - name: Verify frozen evidence
        run: python -m rcdl002 verify-evidence
      - name: Run fresh deterministic calibration
        run: python -m rcdl002 calibrate --output calibration-out --trials 8
      - name: Verify fresh outputs
        run: |
          python -m rcdl002 verify-manifest calibration-out/contract-manifest.json
          python -m rcdl002 verify-projection calibration-out/contract-projection.json
      - name: Randomized active/sham differential probe
        run: python scripts/randomized_probe.py --seeds 64
