name: relational-contract-discovery

on:
  push:
    paths:
      - "experiments/relational-contract-discovery-001/**"
      - ".github/workflows/relational-contract-discovery.yml"
  pull_request:
    paths:
      - "experiments/relational-contract-discovery-001/**"
      - ".github/workflows/relational-contract-discovery.yml"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: experiments/relational-contract-discovery-001
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Verify pinned official reference
        run: python -m rcdl verify-reference
      - name: Verify frozen evidence
        run: python -m rcdl verify-evidence
      - name: Run calibration
        run: python -m rcdl calibrate --output calibration-out --trials 8
      - name: Verify outputs
        run: |
          python -m rcdl verify-manifest calibration-out/contract-manifest.json
          python -m rcdl verify-projection calibration-out/contract-projection.json
      - name: Randomized differential probe
        run: python scripts/randomized_probe.py --seeds 64
